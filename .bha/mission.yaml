  "success_criteria": [
    "verify is read-only",
    "policy_hash and mission_hash are deterministic",
    "ledger hash chain is valid",
    "negative verifier matrix rejects malformed policy, duplicate ledger event_id, stale validation, unsigned capability, stale capability hashes, and unsupported closeout claims",
    "recorded closeout binds verified_ledger_head_hash, closeout_event_hash, and final_ledger_head_hash",
    "state.closeout references the newest recorded closeout when closeouts exist",
    "git_push capability flow is explicit, read-only before signing, and does not handle private key material",
    "rollback drill is read-only and documents non-destructive local recovery from known-good evidence",
    "checkpoint writes resumable handoff evidence and binds it to a checkpoint_written ledger event",
    "state ledger head matches ledger",
    "capability v1 only permits git_push",
    "dirty unvalidated worktree changes block trusted state",
    "prepush-check fails closed without fresh verifier-backed validation, rollback, checkpoint, closeout, and consumed git_push capability"
  ],
  "hard_stop_conditions": [
    "remote_write_without_explicit_user_authorization",
    "secret_or_private_key_access",
    "provider_call",
    "memory_write",
    "deploy_release_or_tag",
    "destructive_filesystem_action",
    "unverified_worktree_change"
  ],
