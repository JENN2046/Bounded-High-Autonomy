{
  "schema": "bha.validation.v1",
  "version": "1.0.0",
  "required_commands": [
    {
      "id": "git_diff_check",
      "argv": [
        "git",
        "diff",
        "--check"
      ],
      "expect": {
        "exit_code": 0
      }
    },
    {
      "id": "node_check_bha_run",
      "argv": [
        "node",
        "--check",
        "scripts/bha-run.js"
      ],
      "expect": {
        "exit_code": 0
      }
    },
    {
      "id": "node_check_bha_verify",
      "argv": [
