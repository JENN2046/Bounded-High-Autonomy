    {
      "id": "make_push_payload_canonical",
      "argv": [
        "node",
        "scripts/bha-run.js",
        "make-push-payload",
        "--remote",
        "origin",
        "--branch",
        "master",
        "--expires-minutes",
        "20",
        "--key-id",
        "owner-main-pkcs8"
      ],
      "expect": {
        "exit_code": 0,
        "json": {
          "schema": "bha.capability.v1",
          "type": "git_push",
          "remote": "origin",
          "branch": "master",
          "one_use": true,
          "signing_key_id": "owner-main-pkcs8",
          "command": "git push origin master"
        },
        "has_keys": [
          "head",
          "policy_hash",
          "mission_hash",
          "algorithm",
          "signature_encoding",
          "payload_hash_format"
        ],
        "missing_keys": [
          "head_sha",
          "payload_hash",
          "signature"
        ]
      }
    },
    {
      "id": "push_prep_current_head_payload",
      "argv": [
        "node",
