        "--check",
        "scripts/bha-verify.js"
      ],
      "expect": {
        "exit_code": 0
      }
    },
    {
      "id": "check_git_status_allow",
      "argv": [
        "node",
        "scripts/bha-run.js",
        "check",
        "--",
        "git",
        "status"
      ],
      "expect": {
        "exit_code": 0,
        "decision": "ALLOW",
        "spawned": false
      }
    },
    {
      "id": "check_git_push_deny",
      "argv": [
        "node",
        "scripts/bha-run.js",
        "check",
